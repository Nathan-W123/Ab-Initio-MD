[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aimd"
version = "0.2.0"
description = "Born-Oppenheimer ab initio molecular dynamics with a native Hartree-Fock engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "tomli>=1.1; python_version < '3.11'",   # TOML config files (tomllib in 3.11+)
]

[project.optional-dependencies]
pyscf = ["pyscf>=2.3"]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "pyscf>=2.3"]
# Psi4 is distributed through conda: conda install -c conda-forge psi4

[project.scripts]
aimd = "aimd.cli:main"

[tool.setuptools.packages.find]
include = ["aimd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` skips the slow tests; `pytest -m slow` runs only them, `pytest -m ""` all.
addopts = "-m 'not slow'"
markers = [
    "slow: long-running tests (deselected by default; run with -m slow)",
]
